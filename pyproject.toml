[project]
name = "roadmind"
version = "0.1.0"
description = "Open-source AI autopilot for driving games on macOS. Local CV brain, Tesla-style vision, learn-by-calibration, whitelisted controls only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "mss",
    "pynput",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Vision",
    "pyobjc-framework-CoreMedia",
    "torch",
    "torchvision",
    "ultralytics",
]

[project.scripts]
roadmind = "roadmind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roadmind*"]