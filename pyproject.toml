[project]
name = "roadmind"
version = "0.2.0"
description = "Open-source AI autopilot for driving games. Local CV brain, Tesla-style vision, learn-by-calibration, whitelisted controls only."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "mss",
    "pynput",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia; sys_platform == 'darwin'",
    "torch",
    "torchvision",
    "ultralytics",
]

[project.scripts]
roadmind = "roadmind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roadmind*"]