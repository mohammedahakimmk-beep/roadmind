name: release

# Builds the RoadMind DMG on a macOS runner and attaches it to a GitHub
# Release whenever you push a tag like v0.2.0:
#   git tag v0.1.0 && git push origin v0.1.0
# Also rewrites version.json so in-app update hints point at the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Python + Tk
        run: |
          brew install python@3.12 python-tk@3.12
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Set up venv
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/python -m pip install -e .

      - name: Fetch YOLO weights (bundled into the app)
        run: curl -sSL -o yolo11n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt

      - name: Build DMG
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export APP_VERSION="$VERSION"
          .venv/bin/python -m PyInstaller --clean --noconfirm packaging/RoadMind.spec
          VERSION="$VERSION" ROADMIND_SKIP_BUILD=1 packaging/build_dmg.sh
          ls -la dist/

      - name: Update version manifest
        run: |
          echo "{\"version\": \"$VERSION\"," > version.json
          echo " \"notes\": \"Release $GITHUB_REF_NAME - see the changelog below.\"," >> version.json
          echo " \"url\": \"https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/RoadMind-$VERSION.dmg\"}" >> version.json

      - name: Create or update release
        run: >
          gh release create "$GITHUB_REF_NAME" \
            --title "RoadMind $GITHUB_REF_NAME" \
            --notes "Automated release built by GitHub Actions from tag $GITHUB_REF_NAME." \
            2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach DMG to release
        run: gh release upload "$GITHUB_REF_NAME" "dist/RoadMind-$VERSION.dmg" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit version manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version manifest to $VERSION"
          git push origin HEAD:main