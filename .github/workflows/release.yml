name: release-windows

# Builds the GameROBOT Windows EXE on a Windows runner and attaches it to a
# GitHub Release whenever you push a tag like v0.5.0:
#   git tag v0.5.0 && git push origin v0.5.0
# Also rewrites version.json so in-app update checks point at the EXE.
#
# macOS DMG builds are OFFICIALLY DISCONTINUED (v0.1.3 was the last). macOS
# TCC/Gatekeeper/quarantine made shipping and re-granting permissions a
# treadmill for the same app; Windows requires no permissions at all.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Fetch YOLO weights (bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt -OutFile yolo11n.pt

      - name: Build EXE (one-file)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/windows.spec
          Get-ChildItem dist

      - name: Smoke-test the bundle (headless selftest inside the exe)
        shell: pwsh
        run: |
          & "dist\GameROBOT.exe" --selftest | Tee-Object -Variable out
          if ("$out" -notmatch "SELFTEST OK") { exit 1 }
          & "dist\GameROBOT.exe" --doctor | Tee-Object -Variable out2

      # ----------------------------------------------------------------------
      # EXE SIGNING (roadmap).
      #
      # To sign (removes the SmartScreen warning), get an OV/EV Authenticode
      # cert, set repo secrets ACS_ENDPOINT / ACS_CLIENT_ID / ACS_CLIENT_SECRET
      # / ACS_CERT_PROFILE_NAME for Azure Trusted Signing, then uncomment:
      #
      # - name: Sign EXE
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     files-path: dist/GameROBOT.exe
      #     sign-options: ""
      #     endpoint: ${{ secrets.ACS_ENDPOINT }}
      #     account: ${{ secrets.ACS_ACCOUNT_NAME }}
      #     certificate-profile: ${{ secrets.ACS_CERT_PROFILE_NAME }}
      #     client-id: ${{ secrets.ACS_CLIENT_ID }}
      #     tenant-id: ${{ secrets.ACS_TENANT_ID }}
      #     client-secret: ${{ secrets.ACS_CLIENT_SECRET }}
      #
      # Then the "Attach EXE" step signs a copy (signtool output goes to the
      # same artifact name) before upload. See README "Signing".
      # ----------------------------------------------------------------------

      - name: Create or update release
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "GameROBOT $env:GITHUB_REF_NAME" `
            --notes "GameROBOT $env:GITHUB_REF_NAME - Windows EXE. The smarter update.

          IMPORTANT: the macOS DMG is officially discontinued (v0.1.3 was the
          last one). macOS TCC/Gatekeeper made even a permission-clean build
          unreliable, so GameROBOT is now Windows-only.

          What changed in this release:
          - Smarter AI: tracks every object (cars, people, bikes, signs) with
            a bounding box + EST-SPEED label above each box; brakes gently for
            humans on the road; ramped throttle + smoothed steering; reads
            speed-limit signs, lanes and traffic lights; leader + human
            distance memory.
          - Brand-new dashboard game menu: WELCOME BACK, DRIVER, live version
            pill, target-game picker, permissions strip, vision-overlay
            settings card and the pulsing IGNITE ENGINE button.
          - Animated cockpit: scan-line vision, LIVE dot, game label, object
            census, per-object boxes and est-speed chips.
          - Rebranded from RoadMind to GameROBOT (same open-source autopilot)." 2>$null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach EXE
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart("v")
          Copy-Item dist\GameROBOT.exe "GameROBOT-$v-Windows.exe"
          gh release upload "$env:GITHUB_REF_NAME" "GameROBOT-$v-Windows.exe" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update version manifest
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart("v")
          $notes = "GameROBOT rebrand + the 10x-smarter update: tracks every object with EST-SPEED labels, brakes for humans, ramped throttle, speed-limit reader, dashboard game menu with IGNITE ENGINE. Windows-only; the macOS DMG is discontinued (last: v0.1.3)."
          @"
          {
            "version": "$v",
            "notes": "$notes",
            "url": "https://github.com/mohammedahakimmk-beep/roadmind/releases/tag/$env:GITHUB_REF_NAME",
            "exe_url": "https://github.com/mohammedahakimmk-beep/roadmind/releases/download/$env:GITHUB_REF_NAME/GameROBOT-$v-Windows.exe"
          }
          "@ | Set-Content -Encoding UTF8 version.json

      - name: Commit version manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version manifest" 2>$null
          git push origin HEAD:main 2>$null
        env:
          GH_TOKEN: ${{ github.token }}